# ─────────────────────────────────────────────────────────────────────────────
# MyAuto Backend — Docker Compose
# Services: backend (FastAPI), nodejs (Socket.IO), redis, postgres (PostGIS),
#           valhalla (routing), photon (geocoding)
# Redis and PostgreSQL are NEVER exposed on the host network.
# Only the backend port 8919, nodejs port 3001, valhalla port 8002,
# and photon port 2322 are accessible from outside the Docker network.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL with PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: myauto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myauto}
      POSTGRES_USER: ${POSTGRES_USER:-myauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myauto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    # NOT exposed to host — only reachable via backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myauto} -d ${POSTGRES_DB:-myauto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: myauto_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    # NOT exposed to host — only reachable via backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myauto_backend
    restart: unless-stopped
    ports:
      - "8919:8919"   # Only the backend port is accessible from outside
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-myauto}:${POSTGRES_PASSWORD:-myauto}@postgres:5432/${POSTGRES_DB:-myauto}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-myauto}:${POSTGRES_PASSWORD:-myauto}@postgres:5432/${POSTGRES_DB:-myauto}
      ENABLE_POSTGRES: ${ENABLE_POSTGRES:-true}
      ENABLE_VALHALLA: ${ENABLE_VALHALLA:-false}
      ENABLE_FIREBASE_AUTH: ${ENABLE_FIREBASE_AUTH:-true}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      VALHALLA_URL: ${VALHALLA_URL:-https://valhalla1.openstreetmap.de}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Firebase
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/serviceAccountKey.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-myauto-493fc}
      FIREBASE_AUTH_MODE: ${FIREBASE_AUTH_MODE:-service_account}
      # App
      APP_ENV: ${APP_ENV:-production}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      # Security
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Thresholds (fall back to defaults from settings.py if not set)
      MAX_MATCH_ACCURACY_METERS: ${MAX_MATCH_ACCURACY_METERS:-100.0}
      MAX_MATCH_AGE_SECONDS: ${MAX_MATCH_AGE_SECONDS:-30}
      INITIAL_RADIUS_KM: ${INITIAL_RADIUS_KM:-2.0}
      FALLBACK_RADIUS_KM: ${FALLBACK_RADIUS_KM:-5.0}
      MAX_RADIUS_KM: ${MAX_RADIUS_KM:-10.0}
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./secrets:/app/secrets:ro
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8919/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s



  # ── Valhalla Routing Engine ───────────────────────────────────────────────────
  # Open-source turn-by-turn routing engine.
  #
  # For DEVELOPMENT: Set VALHALLA_URL=https://valhalla1.openstreetmap.de in
  # Flutter dart-define. This uses the free public Valhalla endpoint.
  # This local container is NOT required for development.
  #
  # For PRODUCTION (self-hosted with Kerala OSM data):
  #   Step 1 — Download Kerala OSM extract (Geofabrik):
  #     curl -Lo ./valhalla/pbf/kerala-latest.osm.pbf \
  #       https://download.geofabrik.de/asia/india/kerala-latest.osm.pbf
  #
  #   Step 2 — Build Valhalla tiles (one-time, takes 5-30 min):
  #     docker compose run --rm valhalla bash -c \
  #       "valhalla_build_tiles -c /valhalla.json /custom_files/kerala-latest.osm.pbf"
  #
  #   Step 3 — Start Valhalla:
  #     docker compose up -d valhalla
  #
  #   Step 4 — Update Flutter dart-define:
  #     --dart-define=VALHALLA_URL=http://<server-ip>:8002
  #
  # Tile volume at /custom_files is shared between tile-build and serving.
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: myauto_valhalla
    profiles:
      - valhalla
      - routing
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      - use_tiles_ignore_pbf=True     # serve from pre-built tiles
      - tile_extract=/custom_files/valhalla_tiles.tar  # optional tar extract
    # Entrypoint fallback: If tiles/config don't exist yet, stay idle and log guidance instead of exiting 0 in a restart loop
    command: >
      bash -c "
        if [ ! -f /custom_files/valhalla.json ] && [ ! -f /custom_files/valhalla_tiles.tar ]; then
          echo '[Valhalla] No pre-built tiles or config found in /custom_files.'
          echo '[Valhalla] To build tiles, run: docker compose --profile valhalla run --rm valhalla valhalla_build_tiles ...'
          echo '[Valhalla] Standing by. (Public Valhalla endpoint is active for development).'
          tail -f /dev/null
        else
          /valhalla/scripts/run.sh
        fi
      "
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Photon Geocoding (Optional Self-Hosted) ───────────────────────────────────
  # Open-source geocoding based on OpenStreetMap data.
  # Community Docker Hub image: rtuszik/photon-docker:latest
  #
  # Note: Requires downloading a pre-built Photon database extract on first run.
  # For development, the free public endpoint is used: PHOTON_URL=https://photon.komoot.io
  photon:
    image: rtuszik/photon-docker:latest
    container_name: myauto_photon
    profiles:
      - photon
      - geocoding
    restart: unless-stopped
    ports:
      - "2322:2322"
    volumes:
      - photon_data:/photon/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:2322/api?q=test&limit=1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  valhalla_tiles:
    driver: local
  photon_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend_net:
    driver: bridge
    internal: false   # backend can reach internet (for Firebase Admin SDK)

